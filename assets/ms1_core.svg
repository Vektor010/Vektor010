<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
    <defs>
        <style>
            .bg { fill: #070709; }
            
            .text-main { font-family: ui-monospace, Consolas, monospace; font-size: 14px; fill: #ffffff; letter-spacing: 1px; }
            .text-accent { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #00ffff; letter-spacing: 2px; }
            .text-magenta { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #ff00ff; letter-spacing: 2px; }
            .text-small { font-family: ui-monospace, Consolas, monospace; font-size: 10px; fill: #4a4a6a; }
            
            .line-main { stroke: #1a1a2a; stroke-width: 1; fill: none; }
            .line-cyan { stroke: #00ffff; stroke-width: 2; fill: none; }
            .line-magenta { stroke: #ff00ff; stroke-width: 2; fill: none; }
            
            /* Extremely smooth animations using basic transforms and stroke offsets (hardware accelerated, 60+ FPS) */
            @keyframes rotate-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            @keyframes rotate-ccw { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
            @keyframes pulse-opacity { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
            @keyframes dash-flow { to { stroke-dashoffset: -200; } }
            @keyframes data-bar { 0%, 100% { transform: scaleX(0.8); } 50% { transform: scaleX(0.98); } }
            @keyframes data-bar-alt { 0%, 100% { transform: scaleX(0.5); } 50% { transform: scaleX(0.85); } }
            
            .anim-rot-cw-slow { animation: rotate-cw 20s linear infinite; transform-origin: 400px 150px; }
            .anim-rot-ccw-slow { animation: rotate-ccw 15s linear infinite; transform-origin: 400px 150px; }
            .anim-rot-cw-fast { animation: rotate-cw 5s linear infinite; transform-origin: 400px 150px; }
            .anim-rot-ccw-fast { animation: rotate-ccw 8s linear infinite; transform-origin: 400px 150px; }
            
            .anim-pulse { animation: pulse-opacity 2s ease-in-out infinite; }
            .anim-pulse-alt { animation: pulse-opacity 3s ease-in-out infinite; }
            
            .anim-flow { stroke-dasharray: 10 10; animation: dash-flow 2s linear infinite; }
            .anim-flow-fast { stroke-dasharray: 20 20; animation: dash-flow 1s linear infinite; }
            
            .anim-bar-1 { animation: data-bar 3s ease-in-out infinite; transform-origin: left; }
            .anim-bar-2 { animation: data-bar-alt 2s ease-in-out infinite; transform-origin: left; }
            .anim-bar-3 { animation: data-bar 4s ease-in-out infinite; transform-origin: left; }
        </style>
    </defs>

    <rect class="bg" width="100%" height="100%"/>

    <!-- Grid / Background elements -->
    <path class="line-main" d="M 0 150 L 800 150" opacity="0.3"/>
    <path class="line-main" d="M 400 0 L 400 300" opacity="0.3"/>
    
    <circle cx="400" cy="150" r="280" class="line-main" opacity="0.2"/>
    <circle cx="400" cy="150" r="200" class="line-main" opacity="0.2"/>

    <!-- LEFT WING: Data Bars (Hardware accelerated scaleX) -->
    <g transform="translate(40, 80)">
        <text class="text-accent" x="0" y="-10">SYS_PERFORMANCE</text>
        <path d="M 0 0 L 150 0 L 160 10" class="line-cyan" opacity="0.5"/>
        
        <text class="text-small" x="0" y="30">RYZEN_VCACHE</text>
        <rect x="0" y="35" width="140" height="4" fill="#1a1a2a"/>
        <rect x="0" y="35" width="140" height="4" fill="#00ffff" class="anim-bar-1"/>
        
        <text class="text-small" x="0" y="60">RTX_GPU_CORE</text>
        <rect x="0" y="65" width="140" height="4" fill="#1a1a2a"/>
        <rect x="0" y="65" width="140" height="4" fill="#ff00ff" class="anim-bar-2"/>
        
        <text class="text-small" x="0" y="90">NET_SUB_TICK</text>
        <rect x="0" y="95" width="140" height="4" fill="#1a1a2a"/>
        <rect x="0" y="95" width="140" height="4" fill="#00ffff" class="anim-bar-3"/>
        
        <!-- Flowing Data Line -->
        <path d="M 0 130 L 80 130 L 100 150 L 220 150" class="line-magenta anim-flow"/>
    </g>

    <!-- RIGHT WING: Readouts -->
    <g transform="translate(600, 80)">
        <text class="text-magenta" x="0" y="-10">TELEMETRY_DATA</text>
        <path d="M 0 0 L 120 0 L 130 -10" class="line-magenta" opacity="0.5"/>
        
        <g opacity="0.8">
            <text class="text-main" x="0" y="30">FPS_SYNC: <tspan class="text-accent">LOCK</tspan></text>
            <text class="text-main" x="0" y="55">PEQ_HZ  : <tspan class="text-magenta">FLAT</tspan></text>
            <text class="text-main" x="0" y="80">HPET    : <tspan class="text-accent">OFF</tspan></text>
            <text class="text-main" x="0" y="105">LTCY    : <tspan class="text-magenta">0.8ms</tspan></text>
        </g>
        
        <!-- Flowing Data Line -->
        <path d="M 0 130 L 80 130 L 100 110 L 180 110" class="line-cyan anim-flow-fast"/>
    </g>

    <!-- CENTER: Massive Smooth Rotating Dials (No drop shadows, pure geometry for 60fps) -->
    <!-- Outer Ring -->
    <g class="anim-rot-cw-slow">
        <circle cx="400" cy="150" r="120" stroke="#1a1a2a" stroke-width="4" fill="none"/>
        <circle cx="400" cy="150" r="120" stroke="#00ffff" stroke-width="4" stroke-dasharray="80 300 40 300" fill="none"/>
    </g>
    
    <!-- Middle Ring -->
    <g class="anim-rot-ccw-slow">
        <circle cx="400" cy="150" r="105" stroke="#1a1a2a" stroke-width="8" fill="none"/>
        <circle cx="400" cy="150" r="105" stroke="#ff00ff" stroke-width="8" stroke-dasharray="40 100 120 400" fill="none" opacity="0.8"/>
        <!-- Ticks -->
        <circle cx="400" cy="150" r="95" stroke="#00ffff" stroke-width="4" stroke-dasharray="2 12" fill="none" opacity="0.5"/>
    </g>
    
    <!-- Inner Fast Ring -->
    <g class="anim-rot-cw-fast">
        <circle cx="400" cy="150" r="80" stroke="#ff00ff" stroke-width="2" stroke-dasharray="20 40" fill="none" opacity="0.6"/>
        <polygon points="400,60 410,75 390,75" fill="#00ffff"/>
        <polygon points="400,240 410,225 390,225" fill="#ff00ff"/>
    </g>
    
    <!-- Core Hub -->
    <g>
        <circle cx="400" cy="150" r="50" fill="#0c0c16" stroke="#00ffff" stroke-width="2"/>
        <circle cx="400" cy="150" r="40" fill="none" stroke="#ff00ff" stroke-width="1" stroke-dasharray="5 5" class="anim-rot-ccw-fast"/>
        
        <text class="text-main" x="400" y="145" text-anchor="middle" font-size="16">MS-1</text>
        <text class="text-accent anim-pulse" x="400" y="165" text-anchor="middle">ONLINE</text>
    </g>

    <!-- Side Brackets -->
    <path d="M 260 100 L 240 100 L 240 200 L 260 200" stroke="#00ffff" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 540 100 L 560 100 L 560 200 L 540 200" stroke="#ff00ff" stroke-width="2" fill="none" opacity="0.4"/>

</svg>